name: desktop_bottom
description: "Windows/Linux X11/macOS desktop-bottom window mode for Flutter."
version: 0.1.1
repository: https://github.com/SQSora/desktop_bottom
issue_tracker: https://github.com/SQSora/desktop_bottom/issues

environment:
  sdk: ^3.10.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DesktopBottomPluginCApi
      linux:
        pluginClass: DesktopBottomPlugin
      macos:
        pluginClass: DesktopBottomPlugin
